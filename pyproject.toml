[project]
name = "radfusion-clinical"
version = "0.1.0"
description = "Reproducible radiographic and multimodal clinical-AI research framework."
readme = "README.md"
authors = [
    { name = "Youssef Shili", email = "youssef.shili.contact@gmail.com" }
]
requires-python = ">=3.13,<3.14"

dependencies = [
    "lightgbm>=4.6.0",
    "matplotlib>=3.11.0",
    "mlflow>=3.14.0",
    "numpy>=2.5.1",
    "pandas>=2.3.3",
    "pillow>=12.3.0",
    "pyarrow>=24.0.0",
    "pydicom>=3.0.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "skops>=0.14.0",
    "sqlalchemy>=2.0.51",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "torchxrayvision>=1.5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radfusion"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
    "integration: requires local RSNA data and is excluded from ordinary test runs",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

acquisition = [
    "kaggle>=2.2.3",
]
