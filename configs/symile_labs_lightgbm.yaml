config_schema_version: 1

dataset:
  dataset_id: symile

task:
  task_id: pneumonia_strict
  label_policy_version: symile-pneumonia-strict-v1

family:
  family_id: labs_lightgbm
  modalities: [labs]
  parameters:
    objective: binary
    num_leaves: 31
    min_child_samples: 20

preprocessing:
  lab_policy: symile-outer-training-right-ecdf-v1

training:
  selection_metric: roc_auc
  parameters:
    n_estimators: 500
    learning_rate: 0.03
    subsample: 0.9
    subsample_freq: 1
    colsample_bytree: 0.9
    reg_lambda: 1.0
    class_weight: null
    early_stopping_rounds: 50
