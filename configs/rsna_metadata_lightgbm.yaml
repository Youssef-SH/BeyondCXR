config_schema_version: 1

dataset:
  dataset_id: rsna

task:
  task_id: pneumonia
  label_policy_version: rsna-stage-2-target-v1

family:
  family_id: metadata_lightgbm
  modalities: [metadata]
  parameters:
    objective: binary
    num_leaves: 31
    min_child_samples: 20

preprocessing:
  metadata_policy: rsna-metadata-input-v1

training:
  selection_metric: average_precision
  parameters:
    n_estimators: 500
    learning_rate: 0.03
    subsample: 0.90
    subsample_freq: 1
    colsample_bytree: 0.90
    reg_lambda: 1.0
    class_weighting: train_neg_pos_ratio
    early_stopping_rounds: 50

evaluation:
  sensitivity_target: 0.90
  calibration_bins: 15
