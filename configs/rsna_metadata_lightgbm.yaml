config_schema_version: 1

dataset:
  dataset_id: rsna
  bundle_id: bundle-a0adf886a59d56cd117c6dc4f3a1d032dac3d279de923ace86b9154930ca3077
  bundle_manifest_sha256: 66c3d2fa739732f952be5b244870fea91d7881c06d500200b95e1fd58858bb27
  split_assignment_id: split-assignment-b36a1ab52e0a2310f3cf1631b40c9b96b027ce67cc65616cdc13c89787396bfd

task:
  task_id: pneumonia
  label_policy_version: rsna-stage-2-target-v1

family:
  family_id: metadata_lightgbm
  modalities: [metadata]
  parameters:
    objective: binary
    num_leaves: 31
    min_child_samples: 20

preprocessing:
  metadata_policy: rsna-metadata-input-v1

training:
  selection_metric: average_precision
  parameters:
    n_estimators: 500
    learning_rate: 0.03
    subsample: 0.90
    subsample_freq: 1
    colsample_bytree: 0.90
    reg_lambda: 1.0
    class_weighting: train_neg_pos_ratio
    early_stopping_rounds: 50

evaluation:
  sensitivity_target: 0.90
  calibration_bins: 15
