config_version: 1
name: image_densenet121
executable: true

dataset:
  registry_key: rsna
  manifest_directory: data/manifests
  bundle_id: build-cfe6e3818fbc179af2cd6237641cdde716159a18c2d1430644bba71058adead0
  task_id: pneumonia
  dataset_root: data/raw/rsna/extracted

model:
  registry_key: image_densenet
  modality: image
  parameters:
    encoder_name: densenet121
    weights: densenet121-res224-chex
    image_size: 224
    embedding_dimension: 1024
    class_weighting: train_pos_weight
  fit_parameters: {}

training:
  seed: 42
  report_directory: reports
  model_directory: models/rsna

evaluation:
  sensitivity_target: 0.90
  calibration_bins: 15
  latency_warmup_calls: 100
  latency_measured_calls: 1000

mlflow:
  experiment_name: radfusion-rsna

image:
  batch_size: 32
  num_workers: 2
  pin_memory_policy: auto
  device: auto
  mixed_precision: true
  rotation_degrees: 7.0
  translation_fraction: 0.05
  brightness_jitter: 0.05
  contrast_jitter: 0.05
  optimizer: adamw
  warmup_epochs: 2
  fine_tune_epochs: 28
  warmup_head_learning_rate: 0.001
  encoder_learning_rate: 0.00001
  head_learning_rate: 0.0001
  weight_decay: 0.0001
  scheduler_factor: 0.5
  scheduler_patience: 2
  scheduler_min_learning_rate: 0.0000001
  gradient_clip_norm: 1.0
  early_stopping_patience: 5
  early_stopping_min_delta: 0.0001
