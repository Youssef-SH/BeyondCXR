config_version: 1
name: symile_gated_no_observedness
family: gated_no_observedness

dataset:
  manifest_directory: data/manifests
  source_root: data/raw/symile/extracted
  bundle_id: build-a75d6c209a207440f24051a1f9038c18103f5936007c7e9e7e20a0a99e0e4826
  bundle_manifest_sha256: eb8fd39108720a4b101c6965fb50d10effe01833f88afa8ba8e06e9f527552e5
  official_split_assignment_id: split-assignment-917a594754a779f0774b690d9f988e29d8773d6a5f619fef379a263a7b700f27
  cv_assignment_id: cv-assignment-db3f94a74694566ae3ce874a11eb8dd716cbbe9d5a739a4c3848faee61b41163
  task_id: pneumonia_strict

preprocessing:
  lab_policy: symile-outer-training-right-ecdf-v1

model:
  encoder_name: densenet121
  weights: densenet121-res224-chex
  image_size: 224
  embedding_dimension: 1024
  pos_weight: 1.0
  fine_tune_scope: terminal
  lab_input_dimension: 100
  image_projection_dimension: 256
  lab_hidden_dimension: 128
  lab_core_dimension: 64
  latent_dimension: 256
  observedness_dimension: 50
  gate_hidden_dimension: 128
  classifier_hidden_dimension: 128
  modalities: 2
  dropout: 0.2
  use_observedness: false

training:
  model_directory: models/symile/development
  report_directory: reports/symile/development
  selection_metric: roc_auc

mlflow:
  experiment_name: radfusion-symile-development

image:
  batch_size: 32
  num_workers: 2
  pin_memory_policy: enabled
  device: cuda
  mixed_precision: true
  rotation_degrees: 7.0
  translation_fraction: 0.05
  brightness_jitter: 0.05
  contrast_jitter: 0.05
  optimizer: adamw
  warmup_epochs: 2
  fine_tune_epochs: 28
  warmup_head_learning_rate: 0.001
  encoder_learning_rate: 0.00001
  head_learning_rate: 0.0001
  weight_decay: 0.0001
  scheduler_factor: 0.5
  scheduler_patience: 2
  scheduler_min_learning_rate: 0.0000001
  gradient_clip_norm: 1.0
  early_stopping_patience: 5
  early_stopping_min_delta: 0.0001
