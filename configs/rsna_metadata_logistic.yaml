config_schema_version: 1

dataset:
  dataset_id: rsna

task:
  task_id: pneumonia
  label_policy_version: rsna-stage-2-target-v1

family:
  family_id: metadata_logistic
  modalities: [metadata]
  parameters: {}

preprocessing:
  metadata_policy: rsna-metadata-input-v1

training:
  selection_metric: none
  parameters:
    l1_ratio: 0.0
    solver: liblinear
    C: 1.0
    max_iter: 2000
    class_weight: balanced

evaluation:
  sensitivity_target: 0.90
  calibration_bins: 15
