config_schema_version: 1

dataset:
  dataset_id: symile

task:
  task_id: pneumonia_strict
  label_policy_version: symile-pneumonia-strict-v1

family:
  family_id: cxr_labs_gated
  modalities: [cxr, labs]
  parameters:
    encoder_name: densenet121
    weights: densenet121-res224-chex
    image_size: 224
    embedding_dimension: 1024
    lab_input_dimension: 100
    lab_hidden_dimension: 128
    lab_core_dimension: 64
    latent_dimension: 256
    observedness_dimension: 50
    gate_hidden_dimension: 128
    classifier_hidden_dimension: 128
    modality_count: 2
    dropout: 0.2
    use_observedness: true

preprocessing:
  cxr_transform_policy: torchxrayvision-densenet121-res224-v1
  lab_policy: symile-outer-training-right-ecdf-v1

training:
  selection_metric: roc_auc
  parameters:
    pos_weight: 1.0
    fine_tune_scope: terminal
    optimizer: adamw
    mixed_precision: true
    warmup_epochs: 2
    fine_tune_epochs: 28
    warmup_head_learning_rate: 0.001
    encoder_learning_rate: 0.00001
    head_learning_rate: 0.0001
    weight_decay: 0.0001
    scheduler_factor: 0.5
    scheduler_patience: 2
    scheduler_min_learning_rate: 0.0000001
    gradient_clip_norm: 1.0
    early_stopping_patience: 5
    early_stopping_min_delta: 0.0001
  loader:
    batch_size: 32
  augmentation:
    rotation_degrees: 7.0
    translation_fraction: 0.05
    brightness_jitter: 0.05
    contrast_jitter: 0.05
